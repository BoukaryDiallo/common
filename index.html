<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des CV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 1.5rem;
      color: #333;
      border-bottom: 3px solid #667eea;
      padding-bottom: 0.5rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 0.75rem 1rem;
      background: #f8f9fa;
      color: #555;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #eee;
      color: #444;
    }
    tr:hover td { background: #f8f9fa; }
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    a:hover { color: #764ba2; text-decoration: underline; }
    .no-link { color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Liste des CV</h1>
    <table>
      <tr><th>Nom</th><th>Dossier</th></tr>
      <tr><td>Boukary DIALLO</td><td class="no-link">-</td></tr>
      <tr><td>Augustin Maré MILLOGO</td><td><a href="CV-MILLOGO/">CV-MILLOGO</a></td></tr>
      <tr><td>Clother NABA</td><td><a href="CV-CLOTHER_NABA/">CV-CLOTHER_NABA</a></td></tr>
      <tr><td>Carelle NAGANDA</td><td><a href="carellecv/">carellecv</a></td></tr>
      <tr><td>Richard MARE</td><td><a href="CV-RICHARD_MARE/">CV-RICHARD_MARE</a></td></tr>
      <tr><td>ASNATH</td><td><a href="CV-ASNATH/">CV-ASNATH</a></td></tr>
      <tr><td>Neerwaya</td><td><a href="CV%20Neerwaya/">CV Neerwaya</a></td></tr>
      <tr><td>Fandie Yombisse</td><td><a href="Fandie_yombisseCV/">Fandie_yombisseCV</a></td></tr>
    </table>
  </div>
</body>
</html>
